services:
  backend:
    build:
      context: ./WebApp/GeneratorService
      target: dev
    ports:
      - "5016:8080"
    volumes:
      - ./WebApp/GeneratorService:/app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./WebApp/Frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./WebApp/Frontend:/app
      - /app/node_modules
